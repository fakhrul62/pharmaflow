services:
  - type: web
    name: pharmaflow-fullstack
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaflow
          property: connectionString
      - key: APP_ORIGIN
        sync: false
databases:
  - name: pharmaflow
    plan: basic-256mb
