name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pharmaflow
          POSTGRES_USER: pharmaflow
          POSTGRES_PASSWORD: ci_only_password
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmaflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://pharmaflow:ci_only_password@localhost:55432/pharmaflow?schema=public
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run typecheck && npm run lint && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
